name: Revisión del template

on:
  pull_request:
    paths:
      - 'participantes/**'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml==6.0.2
      - name: Revisar templates modificados
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          files=$(git diff --name-only --diff-filter=AM "$BASE" HEAD -- 'participantes/**.yaml' 'participantes/**.yml')
          python3 scripts/check_template.py $files
